name: Go checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Check browser JavaScript syntax
        run: node --check cmd/realmkeeper/web/app.js
      - name: Check browser JavaScript for undefined names
        # A call to an undefined function only fails at runtime, after the UI has
        # partly updated; catch it before release.
        run: >-
          npx --yes eslint@10.1.0 --no-config-lookup
          --rule '{"no-undef":"error"}'
          --parser-options ecmaVersion:2022
          --global document,window,localStorage,fetch,EventSource,FormData,AbortController,location,navigator,confirm,prompt,setTimeout,clearTimeout,setInterval,clearInterval,URL,Option,console
          cmd/realmkeeper/web/app.js
      - name: Run vet
        run: go vet ./...
      - name: Build application
        run: go build -trimpath -o /tmp/realmkeeper ./cmd/realmkeeper
      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.casaos.yml config -q
      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=0.6.0 -t realmkeeper:ci .
  browser:
    # Drives the real binary in Chromium: server switching, stale responses,
    # console streaming, capability-gated tabs, mobile drawer and secrets.
    # Playwright 1.56.1 cannot install Chromium on the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build application
        run: go build -trimpath -o /tmp/realmkeeper ./cmd/realmkeeper
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser regression test
        env:
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright/index.mjs
        run: node tests/browser/workspace-selection.mjs /tmp/realmkeeper
